[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-image"
version = "0.1.0"
description = "Reverse-engineer any still image: how it was made, evidence, and recreation plan."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "rea-image authors" }]
dependencies = [
    "pillow>=10.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
rea-image = "rea_image.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["rea_image*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


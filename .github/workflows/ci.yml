name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff Lint Checks
        run: |
          ruff check --select F rea_image tests eval

      - name: Run Pytest Test Suite
        run: |
          python -m pytest --maxfail=1 -v

      - name: Test CLI invocation
        run: |
          rea-image --help
          python -m rea_image.cli --help

      - name: Test CLI eval and batch parallel analyze
        # Gate CI on benchmark accuracy: set to a value just under the measured overall accuracy
        # (currently 90.9%). When updating or adding benchmark fixtures, re-run `rea-image eval`
        # and update --min-accuracy to match the new baseline.
        run: |
          rea-image eval eval/benchmark_data/dataset.json --results "${{ runner.temp }}/r.md" --min-accuracy 90.0
          rea-image analyze eval/benchmark_data/images --jobs 2 --out "${{ runner.temp }}/o"

  test-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies with OCR extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ocr]"

      - name: Run Pytest with Tesseract installed
        run: |
          python -m pytest -v


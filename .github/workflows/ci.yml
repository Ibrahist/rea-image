name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff Lint Checks
        run: |
          ruff check --select F rea_image tests

      - name: Run Pytest Test Suite
        run: |
          python -m pytest --maxfail=1 -v

      - name: Test CLI invocation
        run: |
          rea-image --help
          python -m rea_image.cli --help

  test-ocr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies with OCR extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ocr]"

      - name: Run Pytest with Tesseract installed
        run: |
          python -m pytest tests/test_regressions.py -v

